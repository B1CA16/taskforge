name: PR title

# Squash merges use the PR title as the commit message, and the release tooling
# reads those messages, so titles must follow Conventional Commits.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      # Only reads the title; never checks out code from the pull request.
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            refactor
            perf
            build
            ci
            chore
            style
          requireScope: false
          subjectPattern: ^[a-z].*[^.]$
          subjectPatternError: >-
            The summary "{subject}" must start with a lowercase letter and not end
            with a period (see CONTRIBUTING.md#commit-messages).

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint
    # Pushes to this repo already run CI; for pull requests, only run it for forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff format
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Markdown lint
        run: npx --yes markdownlint-cli2@0.23.3 "**/*.md"
      - name: Links
        run: python scripts/check_links.py

  test:
    name: Test (Python ${{ matrix.python }}, Postgres ${{ matrix.postgres }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        postgres: ["18"]
        include:
          # Oldest supported Postgres, with the oldest supported Python.
          - python: "3.10"
            postgres: "14"
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskforge_test
          # Deliberately not UTC, so timezone bugs fail the tests.
          TZ: Europe/Lisbon
          PGTZ: Europe/Lisbon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d taskforge_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TASKFORGE_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/taskforge_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -ra

  test-windows:
    name: Test (Windows, Python 3.13)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-latest
    env:
      # Credentials of the PostgreSQL that GitHub preinstalls on Windows runners.
      PGUSER: postgres
      PGPASSWORD: root
      TASKFORGE_TEST_DATABASE_URL: postgresql+psycopg://postgres:root@localhost:5432/taskforge_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Start PostgreSQL
        shell: pwsh
        run: |
          $service = Get-Service -Name "postgresql*" | Select-Object -First 1
          Set-Service -InputObject $service -StartupType Manual
          Start-Service -InputObject $service
          & "$env:PGBIN\createdb.exe" taskforge_test
      - run: pip install -e ".[dev]"
      - run: pytest -ra

  build:
    name: Build and check the package
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install the wheel in a clean environment and smoke-test it
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl httpx
          /tmp/wheel-env/bin/python scripts/check_wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "taskforge-queue"  # import name stays `taskforge`; "taskforge" is taken on PyPI
version = "0.2.0.dev0"
description = "Background jobs for Python, stored in your Postgres database: no Redis, no broker."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["task", "job", "queue", "background", "worker", "postgres", "postgresql"]
authors = [
  { name = "Francisco Ferreira", email = "francisco.dinis.ferreira@gmail.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
  "SQLAlchemy>=2.0",
  "python-dotenv>=0.19",
  "psycopg[binary]", # For PostgreSQL support
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "jinja2>=3.1",
  "python-multipart>=0.0.6",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "httpx>=0.27",
  "ruff>=0.16,<0.17",  # formatter output can change between minor versions
  "pre-commit>=3.5",
]

[project.urls]
"Homepage" = "https://github.com/B1CA16/taskforge"
"Bug Tracker" = "https://github.com/B1CA16/taskforge/issues"
"Changelog" = "https://github.com/B1CA16/taskforge/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
# src layout; this also ships the dashboard's templates/ and static/ folders
packages = ["src/taskforge"]

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/demo_client/__pycache__"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# Conventions: docs/contributing/code-style.md
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # import sorting
  "B",        # bugbear: likely bugs
  "UP",       # modern syntax for our minimum Python
  "SIM",      # simplifications
  "RUF",      # ruff-specific checks
  "D",        # docstrings (Google convention, below)
  "TID252",   # no relative imports
  "T20",      # no print() in library code
]
ignore = [
  "D105",     # magic methods don't need docstrings
  "D107",     # __init__ is documented in the class docstring
  "E501",     # line length is handled by the formatter
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection pattern puts these calls in default arguments on purpose.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# Docstrings are optional in tests and examples; print() is fine outside the library.
"tests/**" = ["D", "T20"]
"demo_client/**" = ["D", "T20"]
"src/taskforge/cli/**" = ["T20"]
"scripts/**" = ["T20"]

[tool.ruff.format]
docstring-code-format = true

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TaskForge{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
        :root {
            --bg-primary: #0f1117;
            --bg-secondary: #1a1d27;
            --bg-card: #222633;
            --bg-hover: #2a2e3d;
            --text-primary: #e4e6eb;
            --text-secondary: #8b8f9a;
            --accent-blue: #4a9eff;
            --accent-green: #34d399;
            --accent-yellow: #fbbf24;
            --accent-red: #f87171;
            --accent-purple: #a78bfa;
            --border-color: #2d3142;
            --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 220px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            padding: 1.5rem 0;
            position: fixed;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .sidebar-brand {
            padding: 0 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 1rem;
        }

        .sidebar-brand h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-blue);
            letter-spacing: -0.5px;
        }

        .sidebar-brand span {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .sidebar nav { flex: 1; }

        .sidebar nav a {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.6rem 1.25rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.875rem;
            transition: all 0.15s;
        }

        .sidebar nav a:hover,
        .sidebar nav a.active {
            color: var(--text-primary);
            background: var(--bg-hover);
        }

        .sidebar nav a.active {
            border-right: 2px solid var(--accent-blue);
        }

        /* Main content */
        .main {
            flex: 1;
            margin-left: 220px;
            padding: 2rem;
        }

        .page-header {
            margin-bottom: 1.5rem;
        }

        .page-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .page-header p {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        /* Stat cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.25rem;
        }

        .stat-card .label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.25rem;
        }

        .stat-card .value {
            font-size: 1.75rem;
            font-weight: 700;
            font-family: var(--font-mono);
        }

        .stat-card .value.blue { color: var(--accent-blue); }
        .stat-card .value.green { color: var(--accent-green); }
        .stat-card .value.yellow { color: var(--accent-yellow); }
        .stat-card .value.red { color: var(--accent-red); }
        .stat-card .value.purple { color: var(--accent-purple); }

        /* Cards / Panels */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }

        .card-header {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-body { padding: 1.25rem; }
        .card-body.no-padding { padding: 0; }

        /* Tables */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
        }

        th {
            text-align: left;
            padding: 0.75rem 1rem;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        tr:last-child td { border-bottom: none; }

        tr:hover td { background: var(--bg-hover); }

        /* Status badges */
        .badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .badge-pending { background: rgba(74, 158, 255, 0.15); color: var(--accent-blue); }
        .badge-running { background: rgba(251, 191, 36, 0.15); color: var(--accent-yellow); }
        .badge-done { background: rgba(52, 211, 153, 0.15); color: var(--accent-green); }
        .badge-failed { background: rgba(248, 113, 113, 0.15); color: var(--accent-red); }
        .badge-dead { background: rgba(248, 113, 113, 0.25); color: var(--accent-red); }
        .badge-online { background: rgba(52, 211, 153, 0.15); color: var(--accent-green); }
        .badge-offline { background: rgba(139, 143, 154, 0.15); color: var(--text-secondary); }
        .badge-lost { background: rgba(248, 113, 113, 0.15); color: var(--accent-red); }

        /* Links */
        a.link {
            color: var(--accent-blue);
            text-decoration: none;
        }
        a.link:hover { text-decoration: underline; }

        /* Mono text */
        .mono {
            font-family: var(--font-mono);
            font-size: 0.8rem;
        }

        /* Filters bar */
        .filters {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .filters select,
        .filters input {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .filters select:focus,
        .filters input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            padding: 1rem;
        }

        .pagination a,
        .pagination span {
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            font-size: 0.85rem;
            text-decoration: none;
        }

        .pagination a {
            color: var(--text-secondary);
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
        }

        .pagination a:hover {
            color: var(--text-primary);
            border-color: var(--accent-blue);
        }

        .pagination span.current {
            color: var(--text-primary);
            background: var(--accent-blue);
            border: 1px solid var(--accent-blue);
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border-color);
            text-decoration: none;
            transition: all 0.15s;
        }

        .btn-primary {
            background: var(--accent-blue);
            color: white;
            border-color: var(--accent-blue);
        }

        .btn-primary:hover { opacity: 0.85; }

        .btn-danger {
            background: transparent;
            color: var(--accent-red);
            border-color: var(--accent-red);
        }

        .btn-danger:hover {
            background: rgba(248, 113, 113, 0.1);
        }

        /* Detail page */
        .detail-grid {
            display: grid;
            grid-template-columns: 160px 1fr;
            gap: 0.5rem 1.5rem;
            font-size: 0.9rem;
        }

        .detail-grid dt {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .detail-grid dd {
            color: var(--text-primary);
        }

        pre.payload {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 1rem;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .error-trace {
            background: rgba(248, 113, 113, 0.05);
            border: 1px solid rgba(248, 113, 113, 0.2);
            border-radius: 6px;
            padding: 1rem;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--accent-red);
            overflow-x: auto;
            white-space: pre-wrap;
        }

        /* HTMX loading indicator */
        .htmx-indicator {
            display: none;
            color: var(--accent-blue);
            font-size: 0.85rem;
        }
        .htmx-request .htmx-indicator { display: inline; }

        /* Tags */
        .tag {
            display: inline-block;
            padding: 0.15rem 0.45rem;
            background: rgba(167, 139, 250, 0.12);
            color: var(--accent-purple);
            border-radius: 3px;
            font-size: 0.7rem;
            font-family: var(--font-mono);
            margin-right: 0.25rem;
        }

        /* Two-column layout for sections */
        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 1024px) {
            .two-columns { grid-template-columns: 1fr; }
        }

        /* Auto-refresh indicator */
        .refresh-indicator {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <h1>TaskForge</h1>
                <span>Job Queue Dashboard</span>
            </div>
            <nav>
                <a href="/" class="{% if active_page == 'overview' %}active{% endif %}">Overview</a>
                <a href="/jobs" class="{% if active_page == 'jobs' %}active{% endif %}">Jobs</a>
            </nav>
        </aside>

        <main class="main">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
